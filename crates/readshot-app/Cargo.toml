[package]
name = "readshot-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Readshot binary — composition root wiring all subsystems."

[lib]
name = "readshot_app"
path = "src/lib.rs"

[[bin]]
name = "readshot"
path = "src/main.rs"

[dependencies]
arboard = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
directories = { workspace = true }
global-hotkey = { workspace = true }
iced = { workspace = true }
image = { workspace = true }
muda = { workspace = true }
tray-icon = { workspace = true }
tiny-skia = { workspace = true }
readshot-capture = { path = "../readshot-capture" }
readshot-core = { path = "../readshot-core" }
readshot-ocr = { path = "../readshot-ocr" }
readshot-ui = { path = "../readshot-ui" }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rfd = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSBezierPath",
    "NSColor",
    "NSCursor",
    "NSImage",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSGeometry"] }
screencapturekit = "1.5"

[dev-dependencies]
readshot-capture = { path = "../readshot-capture", features = ["test-fixtures"] }
readshot-ocr = { path = "../readshot-ocr", features = ["test-fixtures"] }
tempfile = { workspace = true }
