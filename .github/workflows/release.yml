name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: readshot-macos-aarch64.dmg
          - target: x86_64-apple-darwin
            os: macos-14
            artifact: readshot-macos-x86_64.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build release binaries (macOS)
        run: cargo build --release --bin readshot --bin readshot-mcp --target ${{ matrix.target }}

      - name: Install Sparkle tools (macOS)
        run: |
          brew install --cask sparkle
          brew install librsvg
          brew install create-dmg
          SPARKLE_ROOT="$(brew list --cask sparkle | awk '/\/bin\/sign_update$/ { sub("/bin/sign_update", ""); print; exit }')"
          echo "${SPARKLE_ROOT}/bin" >> "${GITHUB_PATH}"
          echo "SPARKLE_FRAMEWORK_PATH=${SPARKLE_ROOT}/Sparkle.framework" >> "${GITHUB_ENV}"

      # ─── macOS DMG (Developer ID + notarised when secrets are present;
      #     otherwise self-signed) ───────────────────────────────────────────
      - name: Package DMG (macOS)
        env:
          MACOS_SELF_SIGN_CERT_BASE64: ${{ secrets.MACOS_SELF_SIGN_CERT_BASE64 }}
          MACOS_SELF_SIGN_CERT_PASSWORD: ${{ secrets.MACOS_SELF_SIGN_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SPARKLE_ED_KEY_BASE64: ${{ secrets.SPARKLE_ED_KEY_BASE64 }}
          TARGET: ${{ matrix.target }}
        run: bash packaging/macos/build-dmg.sh

      - name: Rename macOS artifacts
        run: |
          mv target/release/readshot.dmg "target/release/${{ matrix.artifact }}"
          if [ -f target/release/readshot.dmg.sparkle.eddsa.txt ]; then
            mv target/release/readshot.dmg.sparkle.eddsa.txt \
              "target/release/${{ matrix.artifact }}.sparkle.eddsa.txt"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/readshot-macos-*.dmg
            target/release/readshot-macos-*.dmg.sparkle.eddsa.txt
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Compute SHA-256 hashes
        run: |
          mkdir -p out
          find artifacts -type f \( -name "*.dmg" -o -name "*.sparkle.eddsa.txt" \) -exec cp {} out/ \;
          find out -type f -name "*.dmg" -exec sha256sum {} \; > out/SHA256SUMS
          cp install.sh out/install.sh

      - name: Verify Sparkle signatures before publishing
        run: |
          set -euo pipefail
          for arch in aarch64 x86_64; do
            test -s "out/readshot-macos-${arch}.dmg"
            test -s "out/readshot-macos-${arch}.dmg.sparkle.eddsa.txt"
          done

      - name: Prepare release notes
        run: |
          NOTES_PATH="docs/releases/${RELEASE_TAG}.md"
          if [ -f "${NOTES_PATH}" ]; then
            cp "${NOTES_PATH}" out/RELEASE_NOTES.md
          else
            {
              echo "# Readshot ${RELEASE_TAG}"
              echo
              echo "No repo-local release summary was found for ${RELEASE_TAG}."
            } > out/RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            out/*.dmg
            out/SHA256SUMS
            out/install.sh
          body_path: out/RELEASE_NOTES.md
          generate_release_notes: true
          tag_name: ${{ env.RELEASE_TAG }}

      # ─── Sparkle appcast (macOS) ─────────────────────────────────────────
      - name: Update Sparkle appcast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add -B gh-pages pages origin/gh-pages
          else
            mkdir pages
            git -C pages init
            git -C pages checkout -b gh-pages
            git -C pages remote add origin "$(git remote get-url origin)"
          fi
          git -C pages config user.name "github-actions[bot]"
          git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TAG_NAME="${RELEASE_TAG}" \
            bash packaging/macos/update-appcast.sh out pages
          touch pages/.nojekyll

          git -C pages add appcast.xml .nojekyll
          if git -C pages diff --cached --quiet; then
            echo "Sparkle appcast unchanged"
          else
            git -C pages commit -m "chore: publish Sparkle appcast ${RELEASE_TAG}"
            git -C pages push origin HEAD:gh-pages
          fi
          gh release upload "${RELEASE_TAG}" pages/appcast.xml --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # ─── Homebrew Cask ──────────────────────────────────────────────────
      # NOT IMPLEMENTED. Readshot is not yet distributed via Homebrew —
      # there is no homebrew-readshot tap and this step publishes nothing.
      # It is left as a labelled placeholder so the wiring has an obvious
      # home once a tap exists. Do not document Homebrew as a supported
      # install path until this actually opens/updates a tap PR.
      - name: Bump Homebrew Cask (not implemented — no-op)
        run: |
          echo "Homebrew distribution is not set up; nothing to publish."
          echo "See docs/RELEASING.md § 'Update Homebrew Cask'."
