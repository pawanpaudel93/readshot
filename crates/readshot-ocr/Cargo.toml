[package]
name = "readshot-ocr"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Per-OS offline OCR for Readshot behind an OCREngine trait."

[features]
default = []
# Enables real-engine fixture tests. Off by default because they need
# OS-resident OCR (Apple Vision / Windows.Media.Ocr) or downloaded ocrs
# `.rten` model files. CI enables this when the runners have what
# they need.
integration = []

[dependencies]
async-trait = { workspace = true }
directories = { workspace = true }
image = { workspace = true }
readshot-core = { path = "../readshot-core" }
readshot-test-fixtures = { path = "../readshot-test-fixtures" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSString"] }
objc2-vision = { version = "0.3", features = ["VNError", "VNRequest", "VNRequestHandler", "VNRecognizeTextRequest", "VNObservation", "VNTypes"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ocrs = "0.12"
rten = "0.24"

[dev-dependencies]
tokio = { workspace = true }
