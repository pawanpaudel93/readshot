[package]
name = "readshot-capture"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Per-OS screen capture for Readshot behind a Capturer trait."

[features]
default = []
test-fixtures = ["dep:readshot-test-fixtures"]
# Enables tests that hit real OS capture APIs. Off by default because
# they require the user to grant Screen Recording permission (macOS) or
# accept the xdg-desktop-portal dialog (Linux). Higher crates and CI
# enable it via `--features integration`.
integration = []

[dependencies]
async-trait = { workspace = true }
image = { workspace = true }
readshot-core = { path = "../readshot-core" }
readshot-test-fixtures = { path = "../readshot-test-fixtures", optional = true }
tiny-skia = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "1.5", features = ["macos_14_0"] }
core-graphics = "0.25"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
xcap = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
xcap = "0.9"

[dev-dependencies]
readshot-test-fixtures = { path = "../readshot-test-fixtures" }
tokio = { workspace = true }
