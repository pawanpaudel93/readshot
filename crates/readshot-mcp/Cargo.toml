[package]
name = "readshot-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Readshot Model Context Protocol stdio server for AI agents."

[lib]
name = "readshot_mcp"
path = "src/lib.rs"

[[bin]]
name = "readshot-mcp"
path = "src/main.rs"

[dependencies]
base64 = { workspace = true }
directories = { workspace = true }
image = { workspace = true }
readshot-capture = { path = "../readshot-capture" }
readshot-core = { path = "../readshot-core" }
readshot-ocr = { path = "../readshot-ocr" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "io-std", "rt-multi-thread", "macros"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
readshot-capture = { path = "../readshot-capture", features = ["test-fixtures"] }
readshot-ocr = { path = "../readshot-ocr", features = ["test-fixtures"] }
