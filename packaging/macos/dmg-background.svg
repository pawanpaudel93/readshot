<?xml version="1.0" encoding="UTF-8"?>
<!--
  Background of the Readshot DMG window: 640x360 points of content
  (build-dmg.sh sizes the create-dmg window 640x388 so the title bar
  does not crop it). The app icon sits at (160, 170) and the
  Applications link at (480, 170); the arrow points from one to the
  other. build-dmg.sh renders it at 1x and 2x into a HiDPI TIFF.

  Finder draws the icon labels over this art in black in light mode
  and in white in dark mode, and offers no way to change that. The
  fill, #597C84 (relative luminance 0.182), is the mid-tone that gives
  both at least 4.5:1 (white 4.52:1, black 4.64:1), so the labels stay
  readable in either appearance. Keep it flat: a gradient or vignette
  would push part of it out of that narrow band.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#597C84"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 266 170 L 374 170"/>
    <path d="M 354 150 L 376 170 L 354 190"/>
  </g>
  <text x="320" y="300" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Drag Readshot to Applications to install it</text>
</svg>
