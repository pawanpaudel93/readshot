name: test

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt-check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: test (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: cargo check --workspace
        run: cargo check --workspace --all-targets

      - name: cargo clippy --workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo nextest run
        run: cargo nextest run --workspace --no-fail-fast

  # Nightly job: enables `--features integration` and pre-grants
  # Screen Recording on macOS when available so the per-OS smoke tests
  # (screencapturekit, Apple Vision) can run. Capture smoke tests
  # self-skip until CI has a real TCC grant.
  integration:
    name: integration (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run integration]')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Pre-grant Screen Recording (macOS only)
        if: runner.os == 'macOS'
        run: |
          # `tccutil reset ScreenCapture` then a programmatic grant
          # is the standard CI pattern. Implementation deferred to
          # the first runner that needs it.
          echo "Screen Recording pre-grant is not implemented; capture smoke tests self-skip."
      - name: cargo nextest run --features integration
        run: cargo nextest run --workspace --features readshot-capture/integration,readshot-ocr/integration --no-fail-fast
